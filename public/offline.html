<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | BILLINGPOC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background: rgba(37, 99, 235, 0.15);
            border: 2px solid #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
        }
        h2 { font-size: 1.5rem; margin-bottom: 10px; font-weight: 700; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
        .btn-retry {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-retry:hover { background: #1d4ed8; }
        .status-badge {
            display: inline-block;
            background: #334155;
            color: #cbd5e1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">📡</div>
        <h2>Network Offline</h2>
        <p>You appear to be disconnected from the internet or local store server. Please check your connection and tap retry.</p>
        <button onclick="window.location.reload()" class="btn-retry">🔄 Reconnect Now</button>
        <div>
            <span class="status-badge">BILLINGPOC Desktop Shell Active</span>
        </div>
    </div>
</body>
</html>
